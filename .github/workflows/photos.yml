name: Fetch photos

# Runs scripts/fetch_photos.py for species that have no photo yet and commits
# the new photos to main.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_photos.py

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow==11.0.0
      - run: python scripts/fetch_photos.py
      - name: Commit new photos
        run: |
          git config user.name "Jon Solberg"
          git config user.email "jonsolberg@users.noreply.github.com"
          git add app/src/main/assets/photos app/src/main/assets/data/photos.json
          git diff --cached --quiet || { git commit -qm "Photos for new species"; git push origin HEAD:main; }
