name: Remove old releases

# Runs when this file changes: deletes every release and tag except the
# version in app/build.gradle.kts.
on:
  push:
    paths:
      - .github/workflows/cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete older releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          KEEP="v$(grep -oP 'versionName\s*=?\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          echo "Keeping $KEEP"
          for t in $(gh api "repos/$R/tags" -q '.[].name'); do
            [ "$t" = "$KEEP" ] && continue
            gh release delete "$t" -R "$R" --cleanup-tag --yes || gh api -X DELETE "repos/$R/git/refs/tags/$t" || true
          done
