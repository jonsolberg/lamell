name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image recognition model is not kept in git (50 MB, CC BY-NC 4.0):
      # it is downloaded from Hugging Face and converted on the first build, then cached.
      - name: Cache model
        id: model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model
          key: model-${{ hashFiles('scripts/build_model.py', 'scripts/requirements.txt') }}

      - uses: actions/setup-python@v5
        if: steps.model.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"

      - name: Build model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          pip install -r scripts/requirements.txt
          python scripts/build_model.py

      - name: Check species coverage
        run: python3 scripts/check_labels.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret – the APK will be debug-signed."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/app.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: lamell-apk
          path: out/app.apk

      - name: Publish APK to the "apk" branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/out && cp out/app.apk /tmp/out/Lamell.apk
          cp app/src/main/assets/model/meta.json /tmp/out/model-meta.json
          cp app/src/main/assets/model/labels.json /tmp/out/model-labels.json
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=?\s*"\K[^"]+' app/build.gradle* | head -1)
          TAG="v$VERSION"
          # Fixed name, so releases/latest/download/Lamell.apk always points at the newest build.
          cp out/app.apk Lamell.apk
          cp out/app.apk "Lamell-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Lamell-$VERSION.apk" Lamell.apk --clobber
          else
            gh release create "$TAG" "Lamell-$VERSION.apk" Lamell.apk --target "$GITHUB_SHA" \
              --title "Lamell $VERSION" --notes "Built from ${GITHUB_SHA::7}." --latest
          fi
